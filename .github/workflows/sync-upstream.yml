name: Sync upstream main

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'MasamiYo/vphone-cli'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync main from upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${REPOSITORY}/merge-upstream" \
            -f branch=main
